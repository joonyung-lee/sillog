<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title th:text="${title} ?: 'sillog'">sillog</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
					},
					colors: {
						ink: '#111111',
						muted: '#666666',
						subtle: '#f5f5f5',
						border: '#e5e5e5',
					}
				}
			}
		}
	</script>
	<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
	<style>
		html { scroll-behavior: smooth; }

		/* Minimal prose styles for markdown content */
		.prose p { margin: 0 0 1em 0; line-height: 1.7; }
		.prose p:last-child { margin-bottom: 0; }
		.prose strong { font-weight: 600; }
		.prose em { font-style: italic; }
		.prose a { color: #111111; text-decoration: underline; text-underline-offset: 2px; }
		.prose a:hover { color: #666666; }
		.prose ul, .prose ol { margin: 1em 0; padding-left: 1.5em; }
		.prose li { margin: 0.5em 0; line-height: 1.7; }
		.prose code { font-family: ui-monospace, monospace; font-size: 0.875em; background: #f5f5f5; padding: 0.125em 0.375em; border-radius: 3px; }
		.prose pre { background: #f5f5f5; padding: 1em; overflow-x: auto; margin: 1em 0; border: 1px solid #e5e5e5; }
		.prose pre code { background: none; padding: 0; }
		.prose blockquote { border-left: 2px solid #e5e5e5; padding-left: 1em; margin: 1em 0; color: #666666; }
		.prose h1, .prose h2, .prose h3 { font-weight: 600; margin: 1.5em 0 0.5em 0; }
		.prose h1 { font-size: 1.25em; }
		.prose h2 { font-size: 1.125em; }
		.prose h3 { font-size: 1em; }
		.prose img { max-width: 50%; height: auto; margin: 1em 0; border: 1px solid #e5e5e5; }

		/* Active nav underline */
		.nav-active { 
			color: #111111;
			position: relative;
		}
		.nav-active::after {
			content: '';
			position: absolute;
			left: 0;
			right: 0;
			bottom: -4px;
			height: 2px;
			background-color: #111111;
		}
	</style>
</head>
<body class="bg-white text-ink antialiased">
	<!-- Header -->
	<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-border">
		<div class="px-8 h-14 flex items-center justify-between">
			<!-- Logo (left-aligned) -->
			<a href="/changelog" class="text-lg font-semibold tracking-tight hover:text-muted transition-colors">
				joonyung
			</a>

			<!-- Navigation (right-aligned) -->
			<nav class="flex items-center gap-6">
				<a href="/changelog"
				   th:class="${currentPage == 'changelog'} ? 'nav-active text-sm font-medium' : 'text-sm font-medium text-muted hover:text-ink transition-colors'">
					changelog
				</a>
				<a href="/blog"
				   th:class="${currentPage == 'blog'} ? 'nav-active text-sm font-medium' : 'text-sm font-medium text-muted hover:text-ink transition-colors'">
					blog
				</a>
				<a href="/about"
				   th:class="${currentPage == 'about'} ? 'nav-active text-sm font-medium' : 'text-sm font-medium text-muted hover:text-ink transition-colors'">
					about
				</a>
			</nav>
		</div>
	</header>

	<!-- Main content -->
	<main class="h-[calc(100vh-56px)] overflow-hidden">
		<div class="h-full max-w-6xl mx-auto px-8 py-6" th:replace="${content}">
			<!-- content -->
		</div>
	</main>
</body>
</html>

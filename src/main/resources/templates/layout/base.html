<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title th:text="${title} ?: 'sillog'">sillog</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
					},
					colors: {
						ink: '#1a1a1a',
						muted: '#6b7280',
						subtle: '#f8f9fa',
						border: '#e5e7eb',
					}
				}
			}
		}
	</script>
	<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
	<style>
		html { scroll-behavior: smooth; }

		/* Minimal prose styles for markdown content */
		.prose p { margin: 0 0 0.75em 0; }
		.prose p:last-child { margin-bottom: 0; }
		.prose strong { font-weight: 600; }
		.prose em { font-style: italic; }
		.prose a { color: #1a1a1a; text-decoration: underline; text-underline-offset: 2px; }
		.prose a:hover { color: #6b7280; }
		.prose ul, .prose ol { margin: 0.75em 0; padding-left: 1.5em; }
		.prose li { margin: 0.25em 0; }
		.prose code { font-family: ui-monospace, monospace; font-size: 0.875em; background: #f8f9fa; padding: 0.125em 0.25em; }
		.prose pre { background: #f8f9fa; padding: 1em; overflow-x: auto; margin: 0.75em 0; border: 1px solid #e5e7eb; }
		.prose pre code { background: none; padding: 0; }
		.prose blockquote { border-left: 2px solid #e5e7eb; padding-left: 1em; margin: 0.75em 0; color: #6b7280; }
		.prose h1, .prose h2, .prose h3 { font-weight: 600; margin: 1em 0 0.5em 0; }
		.prose h1 { font-size: 1.25em; }
		.prose h2 { font-size: 1.125em; }
		.prose h3 { font-size: 1em; }
		.prose img { max-width: 50%; height: auto; margin: 0.75em 0; border: 1px solid #e5e7eb; }
	</style>
</head>
<body class="bg-white text-ink antialiased">
<div class="min-h-screen flex">
	<!-- Sidebar -->
	<aside class="w-64 border-r border-border bg-subtle flex flex-col fixed h-full">
		<!-- Logo / Blog name -->
		<div class="p-6 border-b border-border">
			<a href="/" class="block">
				<h1 class="text-xl font-semibold tracking-tight">sillog</h1>
				<p class="text-sm text-muted mt-1">personal blog</p>
			</a>
		</div>

		<!-- Navigation -->
		<nav class="flex-1 p-4">
			<ul class="space-y-1">
				<li>
					<a href="/"
					   th:classappend="${currentPage == 'home'} ? 'bg-white text-ink' : 'text-muted hover:text-ink hover:bg-white'"
					   class="flex items-center gap-3 px-3 py-2 text-sm font-medium transition-colors">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
						</svg>
						Home
					</a>
				</li>
				<li>
					<a href="/changelog"
					   th:classappend="${currentPage == 'changelog'} ? 'bg-white text-ink' : 'text-muted hover:text-ink hover:bg-white'"
					   class="flex items-center gap-3 px-3 py-2 text-sm font-medium transition-colors">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
						</svg>
						Changelog
					</a>
				</li>
				<li>
					<a href="/about"
					   th:classappend="${currentPage == 'about'} ? 'bg-white text-ink' : 'text-muted hover:text-ink hover:bg-white'"
					   class="flex items-center gap-3 px-3 py-2 text-sm font-medium transition-colors">
						<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
							<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
						</svg>
						About
					</a>
				</li>
			</ul>
		</nav>
	</aside>

	<!-- Main content -->
	<main class="flex-1 ml-64">
		<div class="max-w-3xl mx-auto px-8 py-12" th:replace="${content}">
			<!-- content -->
		</div>
	</main>
</div>
</body>
</html>

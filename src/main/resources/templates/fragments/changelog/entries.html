<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ═══════════════════════════════════════════════════════════════════════════
     초기 로드용 전체 구조
     ═══════════════════════════════════════════════════════════════════════════ -->
<div th:fragment="entriesList" id="entries-container">
	<th:block th:if="${entries != null && !entries.isEmpty()}">
		<!-- 위쪽: 더 있으면 센티넬, 없으면 끝 표시 -->
		<th:block th:if="${hasMoreAfter}">
			<div th:replace="~{:: sentinelAbove}"></div>
		</th:block>

		<!-- 엔트리 목록 -->
		<th:block th:each="entry : ${entries}">
			<article th:replace="~{:: entryItem(${entry})}"></article>
		</th:block>

		<!-- 아래쪽: 더 있으면 센티넬, 없으면 끝 표시 -->
		<th:block th:if="${hasMoreBefore}">
			<div th:replace="~{:: sentinelBelow}"></div>
		</th:block>
	</th:block>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     위로 스크롤용 (sentinel-above가 자기 자신을 이 내용으로 교체)
     결과: [새 sentinel/끝표시] + [새 entries...] → 기존 sentinel 위치에 삽입
     ═══════════════════════════════════════════════════════════════════════════ -->
<th:block th:fragment="moreAbove">
	<!-- 새 센티넬 또는 끝 표시 -->
	<th:block th:if="${hasMoreAfter}">
		<div th:replace="~{:: sentinelAbove}"></div>
	</th:block>
	<th:block th:if="${!hasMoreAfter}">
		<div th:replace="~{:: endAbove}"></div>
	</th:block>

	<!-- 새 엔트리들 -->
	<th:block th:each="entry : ${entries}">
		<article th:replace="~{:: entryItem(${entry})}"></article>
	</th:block>
</th:block>

<!-- ═══════════════════════════════════════════════════════════════════════════
     아래로 스크롤용 (sentinel-below가 자기 자신을 이 내용으로 교체)
     결과: [새 entries...] + [새 sentinel/끝표시] → 기존 sentinel 위치에 삽입
     ═══════════════════════════════════════════════════════════════════════════ -->
<th:block th:fragment="moreBelow">
	<!-- 새 엔트리들 -->
	<th:block th:each="entry : ${entries}">
		<article th:replace="~{:: entryItem(${entry})}"></article>
	</th:block>

	<!-- 새 센티넬 또는 끝 표시 -->
	<th:block th:if="${hasMoreBefore}">
		<div th:replace="~{:: sentinelBelow}"></div>
	</th:block>
	<th:block th:if="${!hasMoreBefore}">
		<div th:replace="~{:: endBelow}"></div>
	</th:block>
</th:block>

<!-- ═══════════════════════════════════════════════════════════════════════════
     개별 엔트리 아이템 (인라인 레이아웃: 날짜 | 내용)
     ═══════════════════════════════════════════════════════════════════════════ -->
<article th:fragment="entryItem(entry)"
		 th:id="${#temporals.format(entry.date, 'yyyy-MM-dd')}"
		 th:data-date="${#temporals.format(entry.date, 'yyyy-MM-dd')}"
		 class="changelog-entry flex gap-4 mb-6">
	<!-- 날짜 (고정 너비, 오른쪽 정렬) -->
	<div class="w-20 flex-shrink-0 text-right">
		<span class="text-xs font-medium text-muted uppercase tracking-wide"
			  th:text="${#temporals.format(entry.date, 'MMM d').toUpperCase()}">DEC 30</span>
	</div>
	<!-- 내용 -->
	<div class="flex-1 min-w-0">
		<div class="prose prose-sm max-w-none text-sm leading-relaxed"
			 th:utext="${entry.contentHtml}">내용</div>
	</div>
</article>

<!-- ═══════════════════════════════════════════════════════════════════════════
     위쪽 센티넬 (더 있을 때)
     - hx-swap="outerHTML": 자기 자신을 서버 응답으로 통째로 교체
     ═══════════════════════════════════════════════════════════════════════════ -->
<div th:fragment="sentinelAbove"
	 id="sentinel-above"
	 th:data-after="${newestDate}"
	 hx-get="/htmx/changelog/more-after"
	 hx-trigger="sillog-fire"
	 hx-swap="outerHTML"
	 hx-vals="js:{after: document.getElementById('sentinel-above').dataset.after, limit: 10}"
	 class="h-4 -mt-4">
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     아래쪽 센티넬 (더 있을 때)
     ═══════════════════════════════════════════════════════════════════════════ -->
<div th:fragment="sentinelBelow"
	 id="sentinel-below"
	 th:data-before="${oldestDate}"
	 hx-get="/htmx/changelog/more-before"
	 hx-trigger="sillog-fire"
	 hx-swap="outerHTML"
	 hx-vals="js:{before: document.getElementById('sentinel-below').dataset.before, limit: 10}"
	 class="h-4">
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     끝 표시 (더 이상 데이터 없음)
     ═══════════════════════════════════════════════════════════════════════════ -->
<div th:fragment="endAbove" class="h-4"></div>
<div th:fragment="endBelow" class="h-4"></div>

</body>
</html>

<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="calendar" class="border border-border bg-white">
	<!-- Header: toggle + month navigation -->
	<div class="flex items-center justify-between px-4 py-3">
		<button type="button"
				onclick="toggleCalendar()"
				class="flex items-center gap-2 text-sm font-medium hover:text-muted transition-colors">
			<!-- Collapse icon (shown when expanded) -->
			<svg id="calendar-icon-collapse" class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
				<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
			</svg>
			<!-- Expand icon (hidden when expanded) -->
			<svg id="calendar-icon-expand" class="w-3 h-3 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
				<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
			</svg>
			<span id="calendar-label-collapsed" class="hidden">Calendar</span>
			<span id="calendar-label-expanded" th:text="${currentMonthDisplay}">2025년 12월</span>
		</button>
		<div id="calendar-nav" class="flex items-center gap-1">
			<button th:hx-get="${'/htmx/changelog/calendar?month=' + prevMonth}"
					hx-target="#calendar-container"
					hx-swap="innerHTML"
					class="p-1.5 text-muted hover:text-ink transition-colors">
				<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/>
				</svg>
			</button>
			<button th:hx-get="${'/htmx/changelog/calendar?month=' + nextMonth}"
					hx-target="#calendar-container"
					hx-swap="innerHTML"
					class="p-1.5 text-muted hover:text-ink transition-colors">
				<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/>
				</svg>
			</button>
		</div>
	</div>

	<!-- Collapsible calendar body -->
	<div id="calendar-body" class="px-4 pb-4">
		<!-- Weekday headers -->
		<div class="grid grid-cols-7 gap-1 mb-2">
			<div class="text-center text-xs text-muted py-1">S</div>
			<div class="text-center text-xs text-muted py-1">M</div>
			<div class="text-center text-xs text-muted py-1">T</div>
			<div class="text-center text-xs text-muted py-1">W</div>
			<div class="text-center text-xs text-muted py-1">T</div>
			<div class="text-center text-xs text-muted py-1">F</div>
			<div class="text-center text-xs text-muted py-1">S</div>
		</div>

		<!-- Calendar grid -->
		<div class="grid grid-cols-7 gap-1">
			<th:block th:each="day : ${calendarDays}">
				<!-- Empty cell -->
				<div th:if="${day == null}" class="aspect-square"></div>
				
				<!-- Day with entry -->
				<a th:if="${day != null && day.hasEntry}"
				   th:href="${'/changelog?date=' + day.date}"
				   th:text="${day.day}"
				   th:class="${day.isToday 
				   		? 'aspect-square flex items-center justify-center text-xs font-medium bg-ink text-white hover:bg-muted transition-colors cursor-pointer' 
				   		: 'aspect-square flex items-center justify-center text-xs font-medium bg-subtle hover:bg-border transition-colors cursor-pointer'}">
					25
				</a>
				
				<!-- Day without entry -->
				<div th:if="${day != null && !day.hasEntry}"
					 th:text="${day.day}"
					 th:class="${day.isToday 
					 	? 'aspect-square flex items-center justify-center text-xs text-white bg-muted' 
					 	: 'aspect-square flex items-center justify-center text-xs text-muted'}">
					25
				</div>
			</th:block>
		</div>
	</div>

	<script>
		(function() {
			const STORAGE_KEY = 'calendar-collapsed';
			const body = document.getElementById('calendar-body');
			const nav = document.getElementById('calendar-nav');
			const iconCollapse = document.getElementById('calendar-icon-collapse');
			const iconExpand = document.getElementById('calendar-icon-expand');
			const labelCollapsed = document.getElementById('calendar-label-collapsed');
			const labelExpanded = document.getElementById('calendar-label-expanded');
			
			const isMobile = () => window.innerWidth < 1024;
			
			function getDefaultState() {
				const saved = localStorage.getItem(STORAGE_KEY);
				if (saved !== null) return saved === 'true';
				return isMobile();
			}
			
			function applyState(collapsed) {
				if (collapsed) {
					body.classList.add('hidden');
					nav.classList.add('hidden');
					iconCollapse.classList.add('hidden');
					iconExpand.classList.remove('hidden');
					labelCollapsed.classList.remove('hidden');
					labelExpanded.classList.add('hidden');
				} else {
					body.classList.remove('hidden');
					nav.classList.remove('hidden');
					iconCollapse.classList.remove('hidden');
					iconExpand.classList.add('hidden');
					labelCollapsed.classList.add('hidden');
					labelExpanded.classList.remove('hidden');
				}
			}
			
			applyState(getDefaultState());
			
			window.toggleCalendar = function() {
				const isCurrentlyCollapsed = body.classList.contains('hidden');
				const newState = !isCurrentlyCollapsed;
				localStorage.setItem(STORAGE_KEY, newState);
				applyState(newState);
			};
		})();
	</script>
</div>
</body>
</html>

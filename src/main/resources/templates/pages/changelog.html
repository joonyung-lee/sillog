<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::content})}">
<body>
<div th:fragment="content" class="h-full flex flex-col">
	<!-- 2-Column Layout Container (독립 스크롤) -->
	<div class="flex-1 min-h-0 flex flex-col-reverse lg:flex-row gap-6">
		<!-- Entries (70%) - 자체 스크롤 -->
		<div class="flex-1 lg:w-[70%] min-h-0 overflow-y-auto pt-2 hide-scrollbar" id="changelog-scroll-container">
			<div id="changelog-entries"
				 th:hx-get="${targetDate != null ? '/htmx/changelog/entries?around=' + targetDate : '/htmx/changelog/entries'}"
				 hx-trigger="load"
				 hx-swap="innerHTML">
				<p class="text-sm text-muted">Loading...</p>
			</div>
		</div>

		<!-- Right Panel: Calendar + Roadmap (30%) -->
		<div class="w-full lg:w-[30%] flex-shrink-0 flex flex-col min-h-0">
			<!-- Calendar (고정 높이) -->
			<div id="calendar-container"
				 class="flex-shrink-0"
				 th:hx-get="${'/htmx/changelog/calendar?month=' + currentMonth}"
				 hx-trigger="load"
				 hx-swap="innerHTML">
				<div class="text-sm text-muted">Loading...</div>
			</div>

			<!-- Roadmap (flex-1, 자체 스크롤) -->
			<div id="goals-container"
				 class="flex-1 min-h-0"
				 hx-get="/htmx/goals/tree"
				 hx-trigger="load"
				 hx-swap="innerHTML">
				<div class="text-sm text-muted">Loading...</div>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
	(function() {
		const targetDate = /*[[${targetDate}]]*/ null;
		let scrollContainer = null;

		// ─────────────────────────────────────────────────────────────
		// 1. 초기 로드 후 타겟 날짜로 스크롤
		// ─────────────────────────────────────────────────────────────
		document.addEventListener('htmx:afterSettle', function onInitialLoad(e) {
			if (e.detail.target.id !== 'changelog-entries') return;
			document.removeEventListener('htmx:afterSettle', onInitialLoad);

			scrollContainer = document.getElementById('changelog-scroll-container');

			if (targetDate) {
				const el = document.getElementById(targetDate);
				if (el) el.scrollIntoView({ behavior: 'instant', block: 'start' });
			}
			setupDateHighlight();
			setupScrollListener();
			armSentinels();
			
			setTimeout(() => {
				tryFireSentinel(document.getElementById('sentinel-above'));
				tryFireSentinel(document.getElementById('sentinel-below'));
			}, 100);
		});

		// ─────────────────────────────────────────────────────────────
		// 2. 무한 스크롤 (changelog-scroll-container 기준)
		// ─────────────────────────────────────────────────────────────
		let isLoading = false;
		let needsScrollAfterLoad = false;
		let isLoadingAbove = false;
		let anchorElementId = null;
		let anchorElementTop = 0;

		function isVisibleInContainer(el) {
			if (!scrollContainer) return false;
			
			if (el.id === 'sentinel-above') {
				return scrollContainer.scrollTop < 50;
			}
			if (el.id === 'sentinel-below') {
				const { scrollTop, scrollHeight, clientHeight } = scrollContainer;
				return scrollTop + clientHeight >= scrollHeight - 50;
			}
			
			const containerRect = scrollContainer.getBoundingClientRect();
			const elRect = el.getBoundingClientRect();
			return elRect.bottom > containerRect.top && elRect.top < containerRect.bottom;
		}

		function armSentinels() {
			const above = document.getElementById('sentinel-above');
			const below = document.getElementById('sentinel-below');
			if (above) above.dataset.armed = 'true';
			if (below) below.dataset.armed = 'true';
		}

		function disarmSentinels() {
			const above = document.getElementById('sentinel-above');
			const below = document.getElementById('sentinel-below');
			if (above) above.dataset.armed = 'false';
			if (below) below.dataset.armed = 'false';
		}

		function tryFireSentinel(el) {
			if (!el) return;
			if (isLoading) return;
			if (needsScrollAfterLoad) return;
			if (el.dataset.armed !== 'true') return;
			if (!isVisibleInContainer(el)) return;

			el.dataset.armed = 'false';
			isLoading = true;
			needsScrollAfterLoad = true;
			htmx.trigger(el, 'sillog-fire');
		}

		function setupScrollListener() {
			if (!scrollContainer) return;
			
			let rafPending = false;
			scrollContainer.addEventListener('scroll', function() {
				if (rafPending) return;
				rafPending = true;
				requestAnimationFrame(function() {
					rafPending = false;

					if (!isLoading && needsScrollAfterLoad) {
						needsScrollAfterLoad = false;
						armSentinels();
					}

					tryFireSentinel(document.getElementById('sentinel-above'));
					tryFireSentinel(document.getElementById('sentinel-below'));
				});
			}, { passive: true });
		}

		document.addEventListener('htmx:beforeRequest', function(e) {
			const elt = e.detail.elt;
			if (!elt) return;

			if (elt.id === 'sentinel-above') {
				isLoadingAbove = true;
				const firstEntry = document.querySelector('.changelog-entry');
				if (firstEntry) {
					anchorElementId = firstEntry.id;
					anchorElementTop = firstEntry.getBoundingClientRect().top;
				}
			}
		});

		document.addEventListener('htmx:afterSwap', function() {
			if (!isLoadingAbove) return;
			
			if (anchorElementId && scrollContainer) {
				const anchorElement = document.getElementById(anchorElementId);
				if (anchorElement) {
					const newTop = anchorElement.getBoundingClientRect().top;
					const diff = newTop - anchorElementTop;
					scrollContainer.scrollBy({ top: diff, behavior: 'instant' });
				}
			}
			
			isLoadingAbove = false;
			anchorElementId = null;
			anchorElementTop = 0;
		});

		document.addEventListener('htmx:afterSettle', function(e) {
			if (e.detail.target.id === 'calendar-container') {
				highlightCalendar();
				return;
			}
			
			setupDateHighlight();
			
			if (isLoading) {
				isLoading = false;
				disarmSentinels();
			}
		});

		// ─────────────────────────────────────────────────────────────
		// 3. 현재 보고 있는 날짜들 → 캘린더 하이라이트
		// ─────────────────────────────────────────────────────────────
		let visibleDates = new Set();
		let dateObserver = null;

		function setupDateHighlight() {
			if (dateObserver) dateObserver.disconnect();
			visibleDates.clear();

			const container = document.getElementById('changelog-scroll-container');
			
			dateObserver = new IntersectionObserver((entries) => {
				entries.forEach(entry => {
					const date = entry.target.dataset.date;
					if (!date) return;
					
					if (entry.isIntersecting) {
						visibleDates.add(date);
					} else {
						visibleDates.delete(date);
					}
				});
				
				highlightCalendar();
			}, { 
				root: container,
				threshold: 0.01 
			});

			document.querySelectorAll('.changelog-entry').forEach(el => {
				dateObserver.observe(el);
			});
		}

		function highlightCalendar() {
			document.querySelectorAll('#calendar-container .calendar-highlight').forEach(el => {
				el.classList.remove('calendar-highlight', 'outline', 'outline-1', 'outline-ink', '-outline-offset-1');
			});

			visibleDates.forEach(date => {
				const link = document.querySelector(`#calendar-container a[href="/changelog?date=${date}"]`);
				if (link) {
					link.classList.add('calendar-highlight', 'outline', 'outline-1', 'outline-ink', '-outline-offset-1');
				}
			});
		}
	})();
	</script>
</div>
</body>
</html>

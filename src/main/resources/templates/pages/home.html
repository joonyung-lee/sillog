<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::section})}">
<section>
	<header class="mb-8">
		<h1 class="text-2xl font-semibold tracking-tight">Welcome</h1>
		<p class="text-muted mt-2">개인 블로그에 오신 것을 환영합니다.</p>
	</header>

	<!-- htmx demo section -->
	<article class="border border-border rounded-lg p-6 bg-subtle">
		<h2 class="text-sm font-medium text-muted uppercase tracking-wide mb-4">htmx demo</h2>
		<p class="text-sm text-muted mb-4">
			버튼을 누르면 서버가 HTML fragment를 내려주고, htmx가 아래 영역에 삽입합니다.
		</p>

		<button
			hx-get="/htmx/hello"
			hx-target="#result"
			hx-swap="innerHTML"
			class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-lg border border-border bg-white hover:bg-gray-50 transition-colors"
		>
			서버에 요청 보내기
		</button>

		<div class="mt-4 p-4 bg-white border border-border rounded-lg">
			<p class="text-xs font-medium text-muted uppercase tracking-wide mb-2">Result</p>
			<div id="result" class="text-sm text-muted">
				(아직 요청 전)
			</div>
		</div>
	</article>
</section>
</html>
